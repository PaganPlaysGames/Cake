<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CakeScape</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="layout">
      <section class="game-panel">
        <h1>CakeScape</h1>
        <canvas id="game" width="640" height="640" aria-label="Game world"></canvas>
        <p class="hint">WASD/Arrow keys to move. Stand on a node and press <kbd>E</kbd> to gather. Press <kbd>Q</kbd> near the Quest Sage.</p>
      </section>
      <aside class="ui-panel" id="ui"></aside>
    </main>
    <script src="app.js"></script>
  </body>
</html>
